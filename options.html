<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PRism — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #24292f;
      background: #f6f8fa;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #d0d7de;
    }

    .page-header svg {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .page-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #24292f;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #24292f;
    }

    .form-hint {
      display: block;
      font-size: 12px;
      color: #57606a;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      background: #ffffff;
      color: #24292f;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }

    .form-input.error {
      border-color: #cf222e;
      box-shadow: 0 0 0 3px rgba(207, 34, 46, 0.15);
    }

    .field-error {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      color: #cf222e;
    }

    .field-error.visible {
      display: block;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #d0d7de;
    }

    .btn-primary {
      padding: 8px 16px;
      background: #0969da;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #0860ca;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      padding: 8px 14px;
      background: transparent;
      color: #24292f;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .save-status {
      font-size: 12px;
      color: #57606a;
      margin-left: auto;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-status.visible {
      opacity: 1;
    }

    .save-status.success {
      color: #2da44e;
    }

    .save-status.error {
      color: #cf222e;
    }

    .example-repos {
      margin-top: 8px;
    }

    .example-repos span {
      font-size: 12px;
      color: #57606a;
    }

    .example-repos button {
      background: none;
      border: none;
      color: #0969da;
      font-size: 12px;
      cursor: pointer;
      padding: 0 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .example-repos button:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="6" fill="#0969da"/>
        <text x="14" y="20" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">F</text>
      </svg>
      <h1>PRism — Settings</h1>
    </div>

    <div class="form-group">
      <label class="form-label" for="repo-input">GitHub Repository</label>
      <span class="form-hint">Format: <code>owner/repo</code> (e.g., apache/flink)</span>
      <input
        type="text"
        id="repo-input"
        class="form-input"
        placeholder="apache/flink"
        spellcheck="false"
        autocomplete="off"
      >
      <div class="field-error" id="repo-error">
        Invalid format. Use <code>owner/repo</code> (only letters, numbers, hyphens, underscores, dots allowed).
      </div>
      <div class="example-repos">
        <span>Examples:</span>
        <button type="button" data-repo="apache/flink">apache/flink</button>
        <button type="button" data-repo="apache/kafka">apache/kafka</button>
        <button type="button" data-repo="apache/spark">apache/spark</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="username-input">GitHub Username</label>
      <span class="form-hint">Used as the default author filter in the PR list. Leave empty to show all PRs.</span>
      <input
        type="text"
        id="username-input"
        class="form-input"
        placeholder="your-github-username"
        spellcheck="false"
        autocomplete="off"
      >
    </div>

    <div class="form-actions">
      <button class="btn-primary" id="btn-save">Save Settings</button>
      <button class="btn-secondary" id="btn-reset">Reset to Default</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
